################################################################################
# Name:     create_pcluster.yml
# Author:   Rodney Marable <rodney.marable@gmail.com>
# Purpose:  Ansible playbook to create new ParallelCluster v3 stacks
################################################################################

---

- name: Provision a new ParallelCluster stack
  hosts: local
  connection: local
  gather_facts: false
  vars_files:
    - vars_files/{{ cluster_name }}.yml
  vars:
    local_homedir: "{{ lookup('env','HOME') }}"
    local_workingdir: "{{ playbook_dir | dirname }}"

  tasks:
    # make_pcluster.py's argparse choices are bypassed entirely by an
    # `ansible-playbook --extra-vars base_os=<unsupported>` run against this file,
    # and config.pcluster.j2 would then pass that value straight into `Os:`, which
    # upstream PCluster accepts. The node dies at its first package install
    # twenty minutes later. This is the only gate on that path, so it runs before
    # the timer, the SNS topic, and anything else that costs money or leaves a
    # resource behind.
    - name: Assert that base_os and pcluster_os are supported
      assert:
        that:
          - base_os in _supported_base_oses
          - pcluster_os in _supported_pcluster_oses
        fail_msg: >-
          Unsupported OS: base_os={{ base_os }}, pcluster_os={{ pcluster_os }}.
          preinstall.j2 and postinstall.j2 branch on `'ubuntu' in base_os` and
          select a package manager accordingly; any other value renders a script
          with the wrong one and fails the node bootstrap. Valid base_os values
          are {{ _supported_base_oses | join(', ') }}.
        quiet: true
      vars:
        _supported_base_oses:
          - ubuntu2204
          - ubuntu2404
          - ubuntu2204arm
          - ubuntu2404arm
          - rhel9
          - rhel9arm
          - alinux2023
          - alinux2023arm
        _supported_pcluster_oses:
          - ubuntu2204
          - ubuntu2404
          - rhel9
          - alinux2023

    - name: Start a timer for the cluster environment build process
      command: date +%Y-%m-%d\ \@\ %H:%M:%S
      changed_when: false
      register: start_overall_timer

    - name: Print debug mode status
      debug:
        msg: "Debug mode => {{ debug_mode }}"

    - name: Create a local state directory for this cluster
      file:
        path: "{{ cluster_data_dir }}"
        state: directory
        mode: "0755"

    - name: Create an SNS topic to send notifications to cluster_owner_email
      community.aws.sns_topic:
        name: "sns_alerts_{{ cluster_name }}"
        region: "{{ region }}"
        state: present
        display_name: "SNS Alerts for Cluster {{ cluster_name }}"
        subscriptions:
          - endpoint: "{{ cluster_owner_email }}"
            protocol: "email"

    - name: Send an SNS notification announcing the cluster build initiation
      community.aws.sns:
        msg: "Started building {{ cluster_name }} at {{ start_overall_timer.stdout }}"
        subject: "Cluster Deployment Update: {{ cluster_name }}"
        topic: "sns_alerts_{{ cluster_name }}"
        region: "{{ region }}"
      delegate_to: localhost

    - name: Create S3 bucket and EC2 keypair, clean up on failure
      block:
        - name: Create s3_bucketname to support this cluster stack
          amazon.aws.s3_bucket:
            name: "{{ s3_bucketname }}"
            region: "{{ region }}"
            tags:
              ClusterID: "{{ cluster_name }}"
              ClusterStackType: ParallelCluster
              ClusterOSType: "{{ base_os }}"
              ClusterScheduler: "{{ scheduler }}"
              ClusterSerialNumber: "{{ cluster_serial_number }}"
              ClusterOwner: "{{ cluster_owner }}"
              ClusterOwnerEmail: "{{ cluster_owner_email }}"
              ClusterOwnerDepartment: "{{ cluster_owner_department }}"
              ProdLevel: "{{ prod_level }}"
              DEPLOYMENT_DATE: "{{ DEPLOYMENT_DATE }}"
          when: 'project_id == "UNDEFINED"'

        - name: Create s3_bucketname and append the ProjectID tag
          amazon.aws.s3_bucket:
            name: "{{ s3_bucketname }}"
            region: "{{ region }}"
            tags:
              ClusterID: "{{ cluster_name }}"
              ClusterStackType: ParallelCluster
              ClusterOSType: "{{ base_os }}"
              ClusterScheduler: "{{ scheduler }}"
              ClusterSerialNumber: "{{ cluster_serial_number }}"
              ClusterOwner: "{{ cluster_owner }}"
              ClusterOwnerEmail: "{{ cluster_owner_email }}"
              ClusterOwnerDepartment: "{{ cluster_owner_department }}"
              ProjectID: "{{ project_id }}"
              ProdLevel: "{{ prod_level }}"
              DEPLOYMENT_DATE: "{{ DEPLOYMENT_DATE }}"
          when: 'project_id != "UNDEFINED"'

        - name: Create a new security group for mounting external NFS file systems
          amazon.aws.ec2_security_group:
            name: pcluster-{{ cluster_name }}-externalNfs
            description: Permit NFS traffic to/from external NFS file systems
            vpc_id: "{{ vpc_id }}"
            region: "{{ region }}"
            rules:
              - proto: tcp
                ports: [111, 2049, 4045, 4046, 4047]
                cidr_ip: "{{ vpc_cidr | default('10.0.0.0/8') }}"
              - proto: udp
                ports: [111, 2049, 4045, 4046, 4047]
                cidr_ip: "{{ vpc_cidr | default('10.0.0.0/8') }}"
          register: external_nfs_sg
          when: 'enable_external_nfs == "true"'

        - name: Generate a new EC2 keypair for this cluster
          amazon.aws.ec2_key:
            name: "{{ ec2_keypair }}"
            region: "{{ region }}"
            key_type: ed25519
          no_log: true
          register: ec2_private_key

        - name: Check whether the local private key file already exists
          stat:
            path: "{{ ssh_keypair }}"
          register: local_pem_stat

        - name: Abort if keypair exists in AWS but local key file is missing
          fail:
            msg:
              - "ERROR: EC2 keypair '{{ ec2_keypair }}' already exists in AWS but the"
              - "local private key file '{{ ssh_keypair }}' is absent."
              - "AWS never returns key material for an existing keypair."
              - "Delete the keypair from EC2 and re-run, or restore the .pem file:"
              - "  aws ec2 delete-key-pair --key-name {{ ec2_keypair }} --region {{ region }}"
          when:
            - not ec2_private_key.changed
            - not local_pem_stat.stat.exists

        - name: Save the private key
          copy:
            content: "{{ ec2_private_key.key.private_key }}"
            dest: "{{ ssh_keypair }}"
            mode: "0600"
          no_log: true
          when: ec2_private_key.changed

        # Deliberately NOT gated on ec2_private_key.changed. That gate conflated
        # two independent facts: whether AWS minted a new keypair, and whether the
        # secret exists. On a re-run over an existing keypair the task was skipped
        # entirely, so a cluster whose first build failed after the keypair was
        # created but before the secret was written had no secret at all -- and
        # retrieve_ssh_key.<cluster>.sh, the documented recovery path for a lost
        # .pem, then fails with ResourceNotFoundException.
        #
        # Running it unconditionally is safe: --secret-string reads the local
        # .pem, whose presence is already guaranteed by the abort task above, and
        # the failed_when below tolerates ResourceExistsException so a secret that
        # is already there is not an error.
        - name: Store SSH private key in Secrets Manager
          command: >
            aws secretsmanager create-secret
            --name "{{ ssh_secret_name }}"
            --description "SSH private key for ParallelCluster {{ cluster_name }}"
            --secret-string "file://{{ ssh_keypair }}"
            --tags Key=parallelcluster:cluster-name,Value={{ cluster_name }}
            --region "{{ region }}"
          no_log: true
          register: _secret_create
          failed_when: >
            _secret_create.rc != 0 and
            'ResourceExistsException' not in (_secret_create.stderr | default(''))

      rescue:
        - name: Clean up S3 bucket on early-setup failure
          amazon.aws.s3_bucket:
            name: "{{ s3_bucketname }}"
            region: "{{ region }}"
            state: absent
            force: true
          ignore_errors: true

        - name: Clean up EC2 keypair on early-setup failure
          amazon.aws.ec2_key:
            name: "{{ ec2_keypair }}"
            region: "{{ region }}"
            state: absent
          ignore_errors: true

        - name: Clean up SSH Secrets Manager secret on early-setup failure
          command: >
            aws secretsmanager delete-secret
            --secret-id "{{ ssh_secret_name }}"
            --force-delete-without-recovery
            --region "{{ region }}"
          ignore_errors: true

        - name: Clean up external NFS security group on early-setup failure
          amazon.aws.ec2_security_group:
            name: pcluster-{{ cluster_name }}-externalNfs
            region: "{{ region }}"
            state: absent
          ignore_errors: true
          when: 'enable_external_nfs == "true"'

        - name: Re-raise the failure after cleanup
          fail:
            msg: "Cluster setup failed during S3/keypair provisioning. Resources cleaned up. See error above."

    - name: Create local staging directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      with_items:
        - "{{ stage_dir }}"
        - "{{ performance_stage_dir }}"

    # Not moved to Python's render_template like the rest of Tier 1
    # (Workstream 2): when enable_external_nfs is true this template
    # references {{ external_nfs_sg.group_id }}, the result of the
    # `amazon.aws.ec2_security_group` task below, which does not exist
    # until this playbook actually runs. See core_create_cluster's own
    # comment in src/pcluster_core.py for the full explanation.
    - name: Template the cluster config
      template:
        src: "{{ cluster_config_template_orig }}"
        dest: "{{ cluster_config_template }}"
        mode: "0755"

    - name: Copy the operator pre/post-deployment hooks to the cluster data directory
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0755"
      with_items:
        - {src: '{{ user_preinstall_src }}', dest: '{{ cluster_data_dir }}/{{ user_preinstall_s3_dest }}'}
        - {src: '{{ user_postinstall_src }}', dest: '{{ cluster_data_dir }}/{{ user_postinstall_s3_dest }}'}

    - name: PUT the pre/post-deployment scripts and cluster config into s3_bucketname
      amazon.aws.s3_object:
        bucket: "{{ s3_bucketname }}"
        region: "{{ region }}"
        src: "{{ item.src }}"
        object: "{{ item.dest }}"
        permission: private
        encrypt: true
        mode: put
      with_items:
        - {src: '{{ cluster_config_template }}', dest: '{{ s3_script_path }}/{{ cluster_config_dest }}'}
        - {src: '{{ preinstall_rendered }}', dest: '{{ s3_script_path }}/{{ preinstall_s3_dest }}'}
        - {src: '{{ postinstall_rendered }}', dest: '{{ s3_script_path }}/{{ postinstall_s3_dest }}'}
        - {src: '{{ cluster_data_dir }}/{{ user_preinstall_s3_dest }}', dest: '{{ s3_script_path }}/{{ user_preinstall_s3_dest }}'}
        - {src: '{{ cluster_data_dir }}/{{ user_postinstall_s3_dest }}', dest: '{{ s3_script_path }}/{{ user_postinstall_s3_dest }}'}

    - name: Stage and upload monitoring post-install wrapper
      when: 'enable_monitoring == "true"'
      block:
        - name: Download aws-parallelcluster-monitoring tarball from GitHub
          get_url:
            url: "https://github.com/aws-samples/aws-parallelcluster-monitoring/archive/refs/tags/{{ monitoring_version }}.tar.gz"
            dest: "{{ cluster_data_dir }}/aws-parallelcluster-monitoring-{{ monitoring_version }}.tar.gz"
            checksum: "{{ monitoring_version_checksum }}"
            mode: "0644"
        - name: Upload monitoring tarball to S3
          amazon.aws.s3_object:
            bucket: "{{ s3_bucketname }}"
            region: "{{ region }}"
            src: "{{ cluster_data_dir }}/aws-parallelcluster-monitoring-{{ monitoring_version }}.tar.gz"
            object: "{{ s3_script_path }}/aws-parallelcluster-monitoring-{{ monitoring_version }}.tar.gz"
            permission: private
            encrypt: true
            mode: put
        # AL2023 has no docker-compose-plugin package, so upstream's
        # installer/os/alinux2023.sh curls the plugin binary from github.com on
        # every node at boot with no integrity check.  Stage a checksummed copy to
        # S3 instead; the wrapper installs it and patches that curl out before the
        # installer runs.  This is also what makes monitoring work at all on an
        # AL2023 cluster in a private subnet, which cannot reach github.com.
        - name: Download the Docker Compose CLI plugin for Amazon Linux 2023
          when: 'stage_docker_compose == "true"'
          get_url:
            url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-{{ docker_compose_arch }}"
            dest: "{{ docker_compose_local_dest }}"
            checksum: "{{ docker_compose_checksum }}"
            mode: "0755"
        - name: Upload the Docker Compose CLI plugin to S3
          when: 'stage_docker_compose == "true"'
          amazon.aws.s3_object:
            bucket: "{{ s3_bucketname }}"
            region: "{{ region }}"
            src: "{{ docker_compose_local_dest }}"
            object: "{{ s3_script_path }}/{{ docker_compose_s3_dest }}"
            permission: private
            encrypt: true
            mode: put

        - name: Upload monitoring wrapper script to S3
          amazon.aws.s3_object:
            bucket: "{{ s3_bucketname }}"
            region: "{{ region }}"
            src: "{{ monitoring_wrapper_dest }}"
            object: "{{ s3_script_path }}/{{ monitoring_s3_dest }}"
            permission: private
            encrypt: true
            mode: put

    - name: Stage and upload external NFS mount list
      when: 'enable_external_nfs == "true"'
      block:
        - name: PUT the external NFS mount list into s3_bucketname
          amazon.aws.s3_object:
            bucket: "{{ s3_bucketname }}"
            region: "{{ region }}"
            src: "{{ external_nfs_mount_list_template_src }}"
            object: "{{ s3_script_path }}/{{ external_nfs_mount_list_template_dest }}"
            permission: private
            encrypt: true
            mode: put

    - name: Stage performance test scripts and templates
      when:
        - enable_hpc_benchmarks == "true"
      block:
        - name: Copy top-level performance dispatcher scripts to stage_dir
          ansible.builtin.copy:
            src: "{{ performance_rootdir }}/{{ item }}"
            dest: "{{ performance_stage_dir }}/{{ item }}"
            remote_src: true
            mode: "0755"
          with_items:
            - hpc-benchmark.sh
        # Allowlist, not a blocklist: this sync exists only so a head node whose EBS
        # root was replaced can restore the driver.  Everything else in the source
        # tree is either internal (CLAUDE.md), a raw Jinja2 template the operator must
        # never read as documentation, or already delivered personalized by scp into
        # headnode_performance_dir_dest.
        - name: Upload the performance driver to S3 for head node self-repair
          command: >
            aws s3 sync "{{ performance_rootdir }}/" "s3://{{ s3_bucketname }}/hpc-benchmark/"
            --exclude "*"
            --include "hpc-benchmark.sh"
            --region "{{ region }}"

        # Deliberately outside the S3/keypair block above, whose rescue deletes
        # s3_bucketname with force=true on any early-setup failure.  This bucket
        # holds the benchmark results of every past build, so nothing in this
        # toolkit may ever delete it -- not that rescue, and not teardown.
        # state=present is idempotent, so the second and later builds in an
        # account+region are no-ops on an existing bucket.
        - name: Create the long-lived HPC benchmark results bucket
          amazon.aws.s3_bucket:
            name: "{{ results_bucketname }}"
            region: "{{ region }}"
            state: present
            public_access:
              block_public_acls: true
              block_public_policy: true
              ignore_public_acls: true
              restrict_public_buckets: true
            tags:
              Name: ParallelClusterMaker HPC benchmark results
              ClusterStackType: ParallelCluster
              DoNotDelete: "results are retained across cluster rebuilds"

    - name: Start the stack creation timer
      command: date +%Y-%m-%d\ \@\ %H:%M:%S
      changed_when: false
      register: start_stack_creation_timer

    - name: Print cluster launch summary
      debug:
        msg: >-
          {{
            [
              "",
              "==================================================================",
              "                   Cluster Launch Summary",
              "==================================================================",
              "",
              "Cluster Name:      " + cluster_name,
              "SerialDateStamp:   " + cluster_serial_datestamp,
              "Launch Timestamp:  " + start_stack_creation_timer.stdout,
              "Operating System:  " + base_os,
              "HPC Scheduler:     " + scheduler,
              "PCluster Version:  " + pcluster_version,
              "VPC Name:          " + vpc_name,
              "Availability Zone: " + az,
              "Head Node:         " + headnode_instance_type,
            ]
            + (["Login Node:        " + loginnode_instance_type + " (x" + loginnode_count | string + ")"] if enable_loginnode | bool else [])
            + (["CPU Queue:         " + (cpu_instance_types | join(", ")) + "  (min: " + initial_cpu_queue_size | string + "  max: " + max_cpu_queue_size | string + ")"] if enable_cpu_queue | bool else [])
            + (["GPU Queue:         " + (gpu_instance_types | join(", ")) + "  (min: " + initial_gpu_queue_size | string + "  max: " + max_gpu_queue_size | string + ")"] if enable_gpu_queue | bool else [])
            + (["EFA Enabled:       TRUE"] if enable_efa | bool else [])
            + (["EFS Enabled:       TRUE"] if enable_efs | bool else [])
            + (["FSxL Enabled:      TRUE"] if enable_fsx | bool else [])
            + (["External NFS:      TRUE"] if enable_external_nfs | bool else [])
            + (["Monitoring:        TRUE"] if enable_monitoring | bool else [])
            + (["HPC Benchmarks:    TRUE"] if enable_hpc_benchmarks | bool else [])
            + [
              "",
              "Stack build takes 30-45 minutes. Monitor progress with:",
              "  pcluster describe-cluster --cluster-name " + cluster_name + " --region " + region,
              "",
            ]
          }}

    - name: Launch the new ParallelCluster v3 stack
      command: >
        pcluster create-cluster
          --cluster-name {{ cluster_name }}
          --cluster-configuration "{{ cluster_config_template }}"
          --region {{ region }}
          --rollback-on-failure false
      register: create_cluster_result
      failed_when: create_cluster_result.rc != 0

    - name: Wait for the cluster head node to reach running state
      command: >
        pcluster describe-cluster
          --cluster-name {{ cluster_name }}
          --region {{ region }}
      register: cluster_status
      until: >-
        cluster_status.rc == 0 and
        "clusterStatus" in cluster_status.stdout and
        ("CREATE_COMPLETE" in cluster_status.stdout or
         "CREATE_FAILED" in cluster_status.stdout or
         "ROLLBACK_COMPLETE" in cluster_status.stdout or
         "ROLLBACK_FAILED" in cluster_status.stdout)
      retries: "{{ pcluster_create_timeout | default(60) }}"
      delay: 60
      changed_when: false
      # Deliberately not failing here: the two tasks below turn the three
      # possible outcomes into three distinct diagnoses. Ansible's own retry
      # failure would collapse "AWS call failed" and "stack still building"
      # into one opaque message, and every task downstream is gated on
      # head_node_public_ip, which is '' in both cases.
      failed_when: false

    - name: Abort if describe-cluster itself failed
      fail:
        msg:
          - "ERROR: pcluster describe-cluster failed for '{{ cluster_name }}' (rc={{ cluster_status.rc }})."
          - "This is NOT a cluster problem — the AWS call did not succeed, so the"
          - "state of the stack is unknown. The stack may still be building and billing."
          - "aws reported:"
          - "{{ cluster_status.stderr | default('(no stderr)') }}"
          - "AWS_PROFILE in effect: {{ lookup('env', 'AWS_PROFILE') | default('(unset)', true) }}"
          - "Check the stack directly before retrying:"
          - "  pcluster describe-cluster --cluster-name {{ cluster_name }} --region {{ region }}"
      when: cluster_status.rc != 0

    - name: Abort if the stack never reached a terminal state
      fail:
        msg:
          - "ERROR: cluster '{{ cluster_name }}' did not reach CREATE_COMPLETE within"
          - "{{ pcluster_create_timeout | default(60) }} minutes — it is most likely STILL BUILDING."
          - "Nothing has been torn down and the stack is still billing."
          - "Check the stack, then delete it if it is wedged:"
          - "  pcluster describe-cluster --cluster-name {{ cluster_name }} --region {{ region }}"
          - "  ./kill_pcluster.py -N {{ cluster_name }}"
          - "If the build is simply slow, raise --pcluster_create_timeout and rebuild."
      when: >-
        "CREATE_COMPLETE" not in cluster_status.stdout and
        "CREATE_FAILED" not in cluster_status.stdout and
        "ROLLBACK_COMPLETE" not in cluster_status.stdout and
        "ROLLBACK_FAILED" not in cluster_status.stdout

    - name: Stop the stack timer
      command: date +%Y-%m-%d\ \@\ %H:%M:%S
      changed_when: false
      register: stop_stack_creation_timer

    - name: Abort if stack creation failed
      fail:
        msg: "Cluster {{ cluster_name }} creation failed ({{ cluster_status.stdout | from_json | json_query('clusterStatus') }}). Check CloudFormation for details."
      when: >-
        "CREATE_FAILED" in cluster_status.stdout or
        "ROLLBACK_COMPLETE" in cluster_status.stdout or
        "ROLLBACK_FAILED" in cluster_status.stdout

    - name: Get the head node IP address
      set_fact:
        head_node_public_ip: >-
          {{
            (cluster_status.stdout | from_json).get('headNode', {}).get('publicIpAddress')
            or (cluster_status.stdout | from_json).get('headNode', {}).get('privateIpAddress', '')
          }}

    - name: Wait for SSH port to be reachable on the head node
      wait_for:
        host: "{{ head_node_public_ip }}"
        port: 22
        delay: 5
        timeout: 300
        state: started
      when: head_node_public_ip != ''

    # ssh_known_hosts is an absolute path from make_pcluster.py, not "~/...":
    # both shell tasks below quote it, and a quoted tilde is not expanded, so the
    # ssh-keygen -R was a silent no-op and the append below went to a
    # nonexistent ./~/.ssh directory.
    - name: Ensure the local SSH directory exists
      ansible.builtin.file:
        path: "{{ ssh_known_hosts | dirname }}"
        state: directory
        mode: "0700"
      when: head_node_public_ip != ''

    - name: Remove any stale known_hosts entry for the head node
      shell: ssh-keygen -R "{{ head_node_public_ip }}" -f "{{ ssh_known_hosts }}" 2>/dev/null || true
      when: head_node_public_ip != ''

    - name: Accept the SSH fingerprint of the head node
      shell: |
        set -o pipefail
        _tmpfile=$(mktemp)
        trap 'rm -f "$_tmpfile"' EXIT
        ssh-keyscan -T 30 -H "{{ head_node_public_ip }}" 2>/dev/null > "$_tmpfile"
        if [ ! -s "$_tmpfile" ]; then
          echo "ERROR: ssh-keyscan returned no host key for {{ head_node_public_ip }}" >&2
          exit 2
        fi
        touch "{{ ssh_known_hosts }}"
        _added=0
        while IFS= read -r line; do
          if ! grep -qxF "$line" "{{ ssh_known_hosts }}"; then
            # Unguarded on purpose: a failed append means the fingerprint is not
            # recorded and every later ssh/scp task in this play fails on host
            # key verification. The || true that used to be implicit here (the
            # _added=1 assignment always succeeded) reported "changed" on a write
            # that never happened.
            echo "$line" >> "{{ ssh_known_hosts }}" || exit 2
            _added=1
          fi
        done < "$_tmpfile"
        exit $_added
      register: _keyscan_result
      when: head_node_public_ip != ''
      changed_when: _keyscan_result.rc == 1
      failed_when: _keyscan_result.rc > 1

    - name: Create performance directory on the head node
      command: ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new -i "{{ ssh_keypair }}" "{{ ec2_user }}@{{ head_node_public_ip }}" mkdir -p "{{ headnode_performance_dir_dest }}"
      when:
        - enable_hpc_benchmarks == "true"
        - head_node_public_ip != ''

    - name: Transfer the local staging directory to the head node
      shell: >
        ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new -i "{{ ssh_keypair }}" "{{ ec2_user }}@{{ head_node_public_ip }}"
        "mkdir -p $(dirname '{{ stage_dir }}')" &&
        scp -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new -i "{{ ssh_keypair }}" -r "{{ stage_dir }}"
        "{{ ec2_user }}@{{ head_node_public_ip }}:$(dirname '{{ stage_dir }}')"/
      when: head_node_public_ip != ''

    - name: Transfer the default Slurm submission script to the head node
      shell: >
        scp -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new -i "{{ ssh_keypair }}"
        "{{ stage_dir }}/sbatch_default_submission_script.sh"
        "{{ ec2_user }}@{{ head_node_public_ip }}:{{ ec2_user_home }}"
      when: head_node_public_ip != ''

    - name: Deploy performance tree to head node
      when:
        - enable_hpc_benchmarks == "true"
        - head_node_public_ip != ''
      block:
        - name: Copy the performance source tree to its final destination on the head node
          shell: >
            scp -r -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new -i "{{ ssh_keypair }}"
            "{{ performance_stage_dir }}"/*
            "{{ ec2_user }}@{{ head_node_public_ip }}:{{ headnode_performance_dir_dest }}"
    - name: Initialize HPC performance test directory list
      set_fact:
        _perf_dirs: []

    - name: Build list of active HPC performance test directories
      set_fact:
        _perf_dirs: >-
          {{ [ebs_hpc_performance_dir] +
             ([efs_hpc_performance_dir] if enable_efs == 'true' else []) +
             ([fsx_hpc_performance_dir] if enable_fsx == 'true' else []) }}
      when:
        - enable_hpc_benchmarks == "true"
        - head_node_public_ip != ''

    - name: Create HPC performance test directories on the head node
      shell: >
        ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new
        -i "{{ ssh_keypair }}" "{{ ec2_user }}@{{ head_node_public_ip }}"
        sudo mkdir -p "{{ item }}"
      loop: "{{ _perf_dirs }}"
      when:
        - enable_hpc_benchmarks == "true"
        - head_node_public_ip != ''

    - name: Set ownership of HPC performance test directories on the head node
      shell: >
        ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new
        -i "{{ ssh_keypair }}" "{{ ec2_user }}@{{ head_node_public_ip }}"
        sudo chown -R "{{ ec2_user }}:{{ ec2_user }}" "{{ item }}"
      loop: "{{ _perf_dirs }}"
      when:
        - enable_hpc_benchmarks == "true"
        - head_node_public_ip != ''

    - name: Copy performance source tree to HPC performance test directories on the head node
      shell: >
        ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new
        -i "{{ ssh_keypair }}" "{{ ec2_user }}@{{ head_node_public_ip }}"
        cp -a "{{ headnode_performance_dir_dest }}"/* "{{ item }}"
      loop: "{{ _perf_dirs }}"
      when:
        - enable_hpc_benchmarks == "true"
        - head_node_public_ip != ''

    - name: Remove the staging directory on the head node
      command: ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new -i "{{ ssh_keypair }}" "{{ ec2_user }}@{{ head_node_public_ip }}" rm -rf "{{ stage_dir }}"
      when:
        - head_node_public_ip != ''

    - name: Copy the custom scripts from stage_dir to the cluster_data directory
      shell: cp -a "{{ stage_dir }}"/* "{{ cluster_data_dir }}"

    - name: Sync the cluster_data directory to s3_bucketname
      community.aws.s3_sync:
        bucket: "{{ s3_bucketname }}"
        file_root: "{{ cluster_data_dir }}"
        key_prefix: "{{ s3_cluster_data_dir }}"
        region: "{{ region }}"
        exclude: "*.pem"

    - name: Remove the local staging directory
      file:
        path: "{{ stage_dir }}"
        state: absent

    - name: Stop the overall stack timer
      command: date +%Y-%m-%d\ \@\ %H:%M:%S
      changed_when: false
      register: stop_overall_timer

    - name: Template the cluster build summary report
      template:
        src: "{{ sns_build_summary_report_src }}"
        dest: "{{ sns_build_summary_report_dest }}"
        mode: "0644"

    - name: Publish the cluster build summary report via SNS
      community.aws.sns:
        msg: "{{ lookup('file', sns_build_summary_report_dest) }}"
        subject: "Cluster Deployment Update: {{ cluster_name }}"
        topic: "sns_alerts_{{ cluster_name }}"
        region: "{{ region }}"
      delegate_to: localhost

    - name: Build cluster build summary message
      set_fact:
        _build_summary: >-
          {{
            [
              "==================================================================",
              "                   Cluster Build Summary",
              "==================================================================",
              "",
              "Launched the environment: " + start_overall_timer.stdout,
              "Initiated stack creation: " + start_stack_creation_timer.stdout,
              "Completed stack creation: " + stop_stack_creation_timer.stdout,
              "Finished the environment: " + stop_overall_timer.stdout,
              "",
              "Cluster Name:      " + cluster_name,
              "Cluster Type:      " + cluster_type,
              "Serial Datestamp:  " + cluster_serial_datestamp,
              "Availability Zone: " + az,
              "VPC:               " + vpc_name,
              "OS:                " + base_os,
              "Scheduler:         " + scheduler,
              "PCluster Version:  " + pcluster_version,
              "Head Node:         " + headnode_instance_type,
            ]
            + (["Login Node:        " + loginnode_instance_type + " (x" + loginnode_count | string + ")"] if enable_loginnode | bool else [])
            + (["CPU Queue:         " + (cpu_instance_types | join(", "))] if enable_cpu_queue | bool else [])
            + (["GPU Queue:         " + (gpu_instance_types | join(", "))] if enable_gpu_queue | bool else [])
            + (["EFA:               enabled"] if enable_efa | bool else [])
            + [
              "",
              "Shared storage:",
              "  " + ebs_shared_dir.ljust(
                ([ebs_shared_dir] + (['/efs'] if enable_efs | bool else [])
                  + (['/fsx'] if enable_fsx | bool else [])
                  + (['/nfs'] if enable_external_nfs | bool else []))
                  | map('length') | max | int + 2
                ) + "EBS (" + ebs_shared_volume_type + ", "
                + (ebs_shared_volume_size | string) + " GB)",
            ]
            + (["  " + "/efs".ljust(
                  ([ebs_shared_dir] + (['/efs'] if enable_efs | bool else [])
                    + (['/fsx'] if enable_fsx | bool else [])
                    + (['/nfs'] if enable_external_nfs | bool else []))
                    | map('length') | max | int + 2
                  ) + "EFS (" + efs_throughput_mode + " throughput)"] if enable_efs | bool else [])
            + (["  " + "/fsx".ljust(
                  ([ebs_shared_dir] + (['/efs'] if enable_efs | bool else [])
                    + (['/fsx'] if enable_fsx | bool else [])
                    + (['/nfs'] if enable_external_nfs | bool else []))
                    | map('length') | max | int + 2
                  ) + "FSx for Lustre (" + (fsx_size | string) + " GB)"] if enable_fsx | bool else [])
            + (["  " + "/nfs".ljust(
                  ([ebs_shared_dir] + (['/efs'] if enable_efs | bool else [])
                    + (['/fsx'] if enable_fsx | bool else [])
                    + (['/nfs'] if enable_external_nfs | bool else []))
                    | map('length') | max | int + 2
                  ) + "external NFS (" + external_nfs_server + ")"] if enable_external_nfs | bool else [])
            + ["  Spack and shared packages install under " + pkg_dir]
            + [""]
            + (["Access the cluster (login node by default; -H for the head node):"]
               if enable_loginnode | bool
               else ["Access the head node:"])
            + [
              "  ./access_cluster.py -N " + cluster_name,
              "  pcluster ssh --cluster-name " + cluster_name + " -i " + ssh_keypair + " (head node)",
              "  ssh -i " + ssh_keypair + " " + ec2_user + "@" + head_node_public_ip + " (head node)",
              "",
              "Idle compute:",
              "  Compute nodes idle for more than " + (scaledown_idletime | string)
                + " minutes are terminated automatically.",
              "  The head node keeps running and billing until this cluster is deleted.",
              "",
              "Delete this cluster:",
              "  ./kill_pcluster.py -N " + cluster_name + " -O " + cluster_owner + " -A " + az,
              "",
            ]
            + (["Grafana dashboard:  https://" + head_node_public_ip + "/grafana/",
                "                    (Self-signed cert — it is OK to click through browser warnings)",
                "Grafana password:   aws ssm get-parameter --name /parallelcluster/" + cluster_name + "/grafana/admin-password --with-decryption --query Parameter.Value --output text",
                ""] if enable_monitoring | bool else [])
          }}

    - name: Print cluster build summary
      debug:
        msg: "{{ _build_summary }}"

    - name: Print FSx hydration helper script locations
      debug:
        msg:
          - ""
          - "S3→Lustre import path: s3://{{ fsx_s3_import_bucket }}/{{ fsx_s3_import_path }}"
          - "Lustre→S3 export path: s3://{{ fsx_s3_export_bucket }}/{{ fsx_s3_export_path }}"
          - ""
          - "Import S3 to Lustre:     /usr/local/bin/import-s3-to-lustre.sh"
          - "Export Lustre to S3:     /usr/local/bin/export-lustre-to-s3.sh"
          - "Check export status:     /usr/local/bin/check-lustre-export-progress.sh"
          - ""
      when: 'enable_fsx_hydration == "true"'
