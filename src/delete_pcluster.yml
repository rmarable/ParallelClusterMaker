################################################################################
# Name:     delete_pcluster.yml
# Author:   Rodney Marable <rodney.marable@gmail.com>
# Purpose:  Ansible playbook to delete ParallelCluster v3 stacks
################################################################################

---

- name: Delete an existing ParallelCluster stack
  hosts: local
  connection: local
  gather_facts: false
  vars:
    local_homedir: "{{ lookup('env','HOME') }}"
    local_workingdir: "{{ playbook_dir | dirname }}"
    pcluster_delete_timeout: 80
  vars_files:
    - vars_files/{{ cluster_name }}.yml

  tasks:
    - name: Start a timer for the cluster deletion process
      command: date +%Y-%m-%d\ \@\ %H:%M:%S
      changed_when: false
      register: start_delete_timer

    - name: Print cluster deletion notice
      debug:
        msg:
          - ""
          - "================================================================="
          - "Destroying: {{ cluster_name }} in {{ az }}"
          - "Start Time: {{ start_delete_timer.stdout }}"
          - ""
          - "This process will take approximately 5-10 minutes to complete."
          - "================================================================="
          - ""

    - name: Sync performance results to S3 before cluster deletion
      when: enable_hpc_benchmarks == "true"
      block:
        # results_bucketname is newer than enable_hpc_benchmarks, so a vars file
        # rendered by an older toolkit has the gate but not the bucket -- and the
        # sync below interpolates it.  That raised an UndefinedError which the
        # rescue caught, printing "Unexpected error" and naming nothing, so the
        # results were lost silently and teardown went on to destroy the head
        # node holding the only copy.  The name is derivable: it is keyed on
        # account and region alone (_derive_results_bucket, src/pcluster_core.py),
        # both of which every vars file has carried since the v3 migration.  This
        # must render identically to that function -- two sources for one name
        # would make the sync target depend on which toolkit built the cluster,
        # so tests/test_templates.py pins this expression against it rather than
        # restating the value.  On a cluster that old the bucket was never
        # created, so the sync gets NoSuchBucket and the rc != 0 warning below
        # fires: that names the cause and prints the head node path, which is the
        # whole gain here.  The results are not recovered.
        - name: Derive the results bucket name when the vars file predates it
          set_fact:
            results_bucketname: "parallelclustermaker-results-{{ aws_account_id }}-{{ region }}"
          when: results_bucketname is not defined
        - name: Get head node IP for performance results sync
          command: >
            pcluster describe-cluster
              --cluster-name {{ cluster_name }}
              --region {{ region }}
          register: _pre_delete_describe
          changed_when: false
          failed_when: false
        - name: Set head node IP fact
          set_fact:
            _head_node_ip: >-
              {{
                (_pre_delete_describe.stdout | from_json).get('headNode', {}).get('publicIpAddress')
                or (_pre_delete_describe.stdout | from_json).get('headNode', {}).get('privateIpAddress', '')
              }}
          when: _pre_delete_describe.rc == 0 and _pre_delete_describe.stdout != ''
        # results_bucketname, never s3_bucketname: the per-build bucket is deleted
        # a few tasks below when delete_s3_bucketname is true (the default), with
        # force=true purging its objects first.  Syncing there and then deleting
        # it destroyed every result silently -- both tasks succeed, so nothing was
        # collected as orphaned and teardown still printed "has been deleted".
        - name: Push performance results from head node to S3
          command: >
            ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new
            -i "{{ ssh_keypair }}" "{{ ec2_user }}@{{ _head_node_ip }}"
            aws s3 sync "{{ ec2_user_home }}/hpc-benchmark/{{ cluster_name }}/"
            "s3://{{ results_bucketname }}/hpc-benchmark-results/{{ cluster_name }}/{{ cluster_serial_number }}/"
            --exclude "*.pyc" --exclude "__pycache__/*"
            --region "{{ region }}"
          when: _head_node_ip is defined and _head_node_ip != ''
          register: _perf_sync
          failed_when: false
        - name: Warn if performance results sync failed
          debug:
            msg:
              - "WARNING: Could not sync performance results to S3 (rc={{ _perf_sync.rc | default(-1) }})."
              - "Head node may be unreachable, IAM policies may be missing, or S3 bucket may not exist."
              - "Results under {{ ec2_user_home }}/hpc-benchmark/{{ cluster_name }}/ on the head node may be lost."
              - "Proceeding with cluster deletion."
          when: _perf_sync is defined and (_perf_sync.rc is not defined or _perf_sync.rc != 0)
      rescue:
        - name: Warn that performance results sync failed unexpectedly
          debug:
            msg:
              - "WARNING: Unexpected error during performance results sync."
              - "Proceeding with cluster deletion."

    - name: Delete the ParallelCluster v3 stack
      command: >
        pcluster delete-cluster
          --cluster-name {{ cluster_name }}
          --region {{ region }}
      register: pcluster_delete_result
      failed_when: >-
        pcluster_delete_result.rc != 0 and
        "does not exist" not in pcluster_delete_result.stderr and
        "does not exist" not in pcluster_delete_result.stdout and
        "BadRequestException" not in pcluster_delete_result.stderr and
        "BadRequestException" not in pcluster_delete_result.stdout and
        "ClusterNotFound" not in pcluster_delete_result.stderr and
        "ClusterNotFound" not in pcluster_delete_result.stdout

    - name: Wait for the cluster to finish deleting
      command: >
        pcluster describe-cluster
          --cluster-name {{ cluster_name }}
          --region {{ region }}
      register: cluster_delete_status
      until: >-
        "DELETE_COMPLETE" in cluster_delete_status.stdout or
        "DELETE_FAILED" in cluster_delete_status.stdout or
        (cluster_delete_status.rc != 0 and (
          "ClusterNotFound" in cluster_delete_status.stderr or
          "ClusterNotFound" in cluster_delete_status.stdout or
          "does not exist" in cluster_delete_status.stdout or
          "does not exist" in cluster_delete_status.stderr))
      retries: "{{ pcluster_delete_timeout }}"
      delay: 30
      changed_when: false
      failed_when: >-
        cluster_delete_status.rc != 0 and
        "ClusterNotFound" not in cluster_delete_status.stderr and
        "ClusterNotFound" not in cluster_delete_status.stdout and
        "does not exist" not in cluster_delete_status.stdout and
        "does not exist" not in cluster_delete_status.stderr and
        "DELETE_COMPLETE" not in cluster_delete_status.stdout and
        "DELETE_FAILED" not in cluster_delete_status.stdout

    - name: Warn if delete wait timed out without confirmation
      debug:
        msg:
          - "WARNING: cluster deletion wait timed out — cluster may still be deleting."
          - "Check the CloudFormation console before assuming the cluster is gone:"
          - "  aws cloudformation describe-stacks --stack-name parallelcluster-{{ cluster_name }}"
          - "Re-run kill_pcluster.py once the stack reaches DELETE_COMPLETE."
      when: >-
        cluster_delete_status is defined and
        cluster_delete_status.attempts is defined and
        cluster_delete_status.attempts >= (pcluster_delete_timeout | int) and
        "DELETE_COMPLETE" not in cluster_delete_status.stdout and
        "DELETE_FAILED" not in cluster_delete_status.stdout and
        "ClusterNotFound" not in (cluster_delete_status.stderr | default(''))

    - name: Record DELETE_FAILED state without aborting
      set_fact:
        _cf_delete_failed: >-
          {{ cluster_delete_status is defined and
             "DELETE_FAILED" in (cluster_delete_status.stdout | default('')) }}

    # The SSH keypair, the local .pem, and the Secrets Manager secret are the
    # only ways back into a head node. They may be destroyed ONLY once the
    # stack is confirmed gone -- positively, by DELETE_COMPLETE or by the
    # cluster no longer existing. Gating them on "not DELETE_FAILED" instead
    # treated a wait *timeout* as a clean delete and destroyed all three while
    # the stack was still DELETE_IN_PROGRESS, which is precisely the case the
    # DELETE_FAILED warning above says they are preserved for. Any state that
    # is neither confirmed-gone nor DELETE_FAILED must preserve them too, so
    # this is expressed as a positive confirmation rather than a blocklist.
    - name: Record whether the stack is confirmed gone
      set_fact:
        _cf_delete_confirmed: >-
          {{ cluster_delete_status is defined and
             ("DELETE_COMPLETE" in (cluster_delete_status.stdout | default('')) or
              "ClusterNotFound" in (cluster_delete_status.stdout | default('')) or
              "ClusterNotFound" in (cluster_delete_status.stderr | default('')) or
              "does not exist" in (cluster_delete_status.stdout | default('')) or
              "does not exist" in (cluster_delete_status.stderr | default(''))) }}

    # Both summary tasks below, and the SNS report, said "Cluster <name> has been
    # deleted" whenever no cleanup step *failed* -- which is true of a wait
    # timeout, where nothing failed and nothing was deleted either.  So teardown
    # printed "may still be deleting" and "credentials are PRESERVED", then
    # contradicted both twelve lines later and exited 0.  There are three
    # outcomes, not two, and the orphan list is orthogonal to all of them: the
    # headline is derived once here so no surface can disagree with another, and
    # this runs before the SNS report is templated for that reason.
    - name: Record what the summary is allowed to claim about the stack
      set_fact:
        _delete_headline: >-
          {{ "Cluster " ~ cluster_name ~ " has been deleted."
             if (_cf_delete_confirmed | bool)
             else ("Cluster " ~ cluster_name ~ " reached DELETE_FAILED and was NOT deleted."
                   if (_cf_delete_failed | bool)
                   else "Deletion of cluster " ~ cluster_name ~ " was NOT confirmed.") }}

    - name: Warn that cluster access credentials are being preserved
      debug:
        msg:
          - "WARNING: deletion of cluster '{{ cluster_name }}' was never confirmed, so the"
          - "SSH keypair, the local .pem file, and the Secrets Manager secret are PRESERVED."
          - "Every other resource is still cleaned up below."
          - "The stack may still be deleting, or the wait may have timed out — either way"
          - "the head node stays reachable for troubleshooting while it is still billing."
          - "Confirm the stack is gone, then re-run to remove the credentials:"
          - "  pcluster describe-cluster --cluster-name {{ cluster_name }} --region {{ region }}"
          - "  ./kill_pcluster.py -N {{ cluster_name }}"
      when: not (_cf_delete_confirmed | bool) and not (_cf_delete_failed | bool)

    - name: Warn operator about DELETE_FAILED — cleanup will still run
      debug:
        msg:
          - "WARNING: CloudFormation stack deletion reached DELETE_FAILED for cluster '{{ cluster_name }}'."
          - "This usually means a resource (ENI, security group, EFA interface) still has dependencies."
          - "IAM roles, SSM parameters, and S3 resources will still be cleaned up below."
          - "The SSH keypair, local .pem file, and Secrets Manager secret are preserved so the"
          - "head node stays reachable for manual troubleshooting until the stack is fully deleted."
          - "Check the CloudFormation console for the failed resource:"
          - "  aws cloudformation describe-stack-events --stack-name parallelcluster-{{ cluster_name }} --region {{ region }}"
          - "Resolve the CloudFormation dependency and re-run kill_pcluster.py if needed."
      when: _cf_delete_failed | bool

    # No no_log here: this call passes only a key *name* and returns
    # {"key": None, "msg": "key deleted"} (ec2_key.py), so nothing sensitive is
    # exposed -- while no_log on a failure censors the one line naming the
    # cause. no_log IS correct on the creation side, which handles real key
    # material. ignore_errors is required because this was the only
    # AWS-mutating cleanup task without it: a single denied DeleteKeyPair
    # aborted the play before every later cleanup step AND before the orphan
    # collection below, silently leaking nine resource classes.
    - name: Delete the EC2 keypair associated with this cluster
      amazon.aws.ec2_key:
        name: "{{ ec2_keypair }}"
        region: "{{ region }}"
        state: absent
      register: _rm_ec2_keypair
      ignore_errors: true
      when: _cf_delete_confirmed | bool

    # ignore_errors but no register: a local file that will not delete orphans
    # nothing in AWS, so there is nothing for the orphan report to name -- but
    # aborting here would abandon every AWS cleanup task below it.
    - name: Delete the SSH private key associated with this cluster
      file:
        path: "{{ ssh_keypair }}"
        state: absent
      ignore_errors: true
      when: _cf_delete_confirmed | bool

    - name: Delete the S3 bucket associated with this cluster
      amazon.aws.s3_bucket:
        name: "{{ s3_bucketname }}"
        region: "{{ region }}"
        state: absent
        force: true
      ignore_errors: true
      register: _rm_s3_bucket
      when: 'delete_s3_bucketname == "true"'

    - name: Check for the existence of cluster_data_dir
      stat:
        path: "{{ cluster_data_dir }}"
      register: isdir_cdd

    - name: Detach the IAM policy associated with Lustre-S3 hydration before role deletion
      when: enable_fsx_hydration is defined and enable_fsx_hydration == "true"
      block:
        - name: Detach the FSx hydration IAM policy from the role
          amazon.aws.iam_policy:
            iam_type: role
            iam_name: "{{ ec2_iam_role }}"
            policy_name: "{{ fsx_hydration_iam_policy }}"
            state: absent
          ignore_errors: true
          register: _rm_fsx_hydration_policy

    - name: Delete Grafana SSM password parameter
      community.aws.ssm_parameter:
        name: "/parallelcluster/{{ cluster_name }}/grafana/admin-password"
        region: "{{ region }}"
        state: absent
      ignore_errors: true
      register: _rm_grafana_ssm_param
      when: enable_monitoring is defined and enable_monitoring == "true"

    - name: Delete SSH private key from Secrets Manager
      command: >
        aws secretsmanager delete-secret
        --secret-id "{{ ssh_secret_name }}"
        --force-delete-without-recovery
        --region "{{ region }}"
      ignore_errors: true
      register: _rm_ssh_secret
      when: _cf_delete_confirmed | bool

    - name: Detach and delete managed IAM policies associated with the cluster stack
      amazon.aws.iam_managed_policy:
        policy_name: "{{ item }}"
        state: absent
      with_items:
        - "{{ ec2_iam_policy }}-HeadNode-Compute"
        - "{{ ec2_iam_policy }}-HeadNode-Storage"
        - "{{ ec2_iam_policy }}-HeadNode-IAM"
        - "{{ ec2_iam_policy }}-ComputeNode-Base"
      ignore_errors: true
      register: _rm_iam_policies

    - name: Detach and delete monitoring IAM policy
      amazon.aws.iam_managed_policy:
        policy_name: "{{ ec2_iam_policy }}-HeadNode-Monitoring"
        state: absent
      ignore_errors: true
      register: _rm_monitoring_policy
      when: enable_monitoring is defined and enable_monitoring == "true"

    - name: Delete the IAM roles associated with the cluster stack
      amazon.aws.iam_role:
        name: "{{ item }}"
        region: "{{ region }}"
        state: absent
        delete_instance_profile: true
      with_items:
        - "{{ ec2_iam_role }}"
      ignore_errors: true
      register: _rm_iam_role

    - name: Delete the external NFS security group associated with this cluster
      amazon.aws.ec2_security_group:
        name: "pcluster-{{ cluster_name }}-externalNfs"
        region: "{{ region }}"
        state: absent
      ignore_errors: true
      register: _rm_external_nfs_sg
      when:
        - enable_external_nfs is defined and enable_external_nfs == "true"

    # This directory holds the .pem, retrieve_ssh_key.<cluster>.sh, and
    # <cluster>.serial -- the access path and the only record of the serial
    # number a retry needs. Same positive gate as the three credential tasks.
    - name: Delete the cluster data directory
      file:
        path: "{{ cluster_data_dir }}"
        state: absent
      when:
        - isdir_cdd.stat.isdir is defined and isdir_cdd.stat.isdir
        - _cf_delete_confirmed | bool

    # Every cleanup task above carries ignore_errors so one AWS failure cannot
    # abandon the rest of the teardown. Without collecting them, a failed IAM
    # detach still printed "Cluster <name> has been deleted" and the operator
    # found the orphans days later by hand. _orphaned_resources is what the
    # summary, the SNS report, and the final exit status all read.
    #
    # This runs before the SNS report is templated, so the SNS topic itself --
    # which must outlive the report it carries -- is appended further down.
    - name: Collect cleanup failures that ignore_errors swallowed
      set_fact:
        _orphaned_resources: >-
          {{ [
               ('EC2 keypair ' ~ ec2_keypair)
                 if (_rm_ec2_keypair.failed | default(false)) else '',
               ('S3 bucket ' ~ s3_bucketname)
                 if (_rm_s3_bucket.failed | default(false)) else '',
               ('FSx hydration inline policy ' ~ (fsx_hydration_iam_policy | default('UNDEFINED')))
                 if (_rm_fsx_hydration_policy.failed | default(false)) else '',
               ('SSM parameter /parallelcluster/' ~ cluster_name ~ '/grafana/admin-password')
                 if (_rm_grafana_ssm_param.failed | default(false)) else '',
               ('Secrets Manager secret ' ~ ssh_secret_name)
                 if (_rm_ssh_secret.failed | default(false)) else '',
               ('IAM managed policies ' ~ ec2_iam_policy ~ '-{HeadNode-Compute,HeadNode-Storage,HeadNode-IAM,ComputeNode-Base}')
                 if (_rm_iam_policies.failed | default(false)) else '',
               ('IAM managed policy ' ~ ec2_iam_policy ~ '-HeadNode-Monitoring')
                 if (_rm_monitoring_policy.failed | default(false)) else '',
               ('IAM role and instance profile ' ~ ec2_iam_role)
                 if (_rm_iam_role.failed | default(false)) else '',
               ('security group pcluster-' ~ cluster_name ~ '-externalNfs')
                 if (_rm_external_nfs_sg.failed | default(false)) else '',
             ] | reject('equalto', '') | list }}

    # Resources teardown deliberately leaves in the account. These are NOT
    # orphans and must never reach _orphaned_resources: that list drives the
    # non-zero exit status, and each of these is a choice rather than a failure.
    # But "deliberate" is not the same as "free" -- a retained bucket and 33
    # retained log groups are a real bill, and a skipped delete registers as
    # `''` rather than `.failed`, so nothing named them and the operator had no
    # way to know from the teardown output that anything was left.
    #
    # The log group is named by PREFIX, not in full: PCluster appends a
    # %Y%m%d%H%M creation timestamp to the group name, so the exact name cannot
    # be constructed here (see the retained-log-group bullet in CLAUDE.md).
    - name: Collect the resources this teardown deliberately retained
      set_fact:
        _retained_resources: >-
          {{ [
               ('S3 bucket ' ~ s3_bucketname ~ ' (--delete_s3_bucketname was not true)')
                 if (delete_s3_bucketname != "true") else '',
               ('S3 bucket ' ~ results_bucketname ~ ' (benchmark results, shared by every cluster in this account and region)')
                 if (enable_hpc_benchmarks == "true") else '',
               'CloudWatch log groups /aws/parallelcluster/' ~ cluster_name ~ '-* (retained 180 days; the only record of a failed build)',
             ] | reject('equalto', '') | list }}

    - name: Stop the timer
      command: date +%Y-%m-%d\ \@\ %H:%M:%S
      changed_when: false
      register: stop_delete_timer

    - name: Template the cluster destruction summary report
      template:
        src: "{{ sns_destruction_summary_report_src }}"
        dest: "/tmp/sns_destruction_summary.{{ cluster_name }}.txt"
        mode: "0644"
      when: isdir_cdd.stat.isdir is defined and isdir_cdd.stat.isdir

    - name: Distribute the cluster destruction summary report via SNS
      community.aws.sns:
        msg: "{{ lookup('file', '/tmp/sns_destruction_summary.' + cluster_name + '.txt') }}"
        subject: "Cluster Destruction Notice: {{ cluster_name }}"
        topic: "sns_alerts_{{ cluster_name }}"
        region: "{{ region }}"
      ignore_errors: true
      delegate_to: localhost
      when: isdir_cdd.stat.isdir is defined and isdir_cdd.stat.isdir

    - name: Delete the SNS topic associated with this cluster
      community.aws.sns_topic:
        name: "sns_alerts_{{ cluster_name }}"
        region: "{{ region }}"
        state: absent
        subscriptions:
          - endpoint: "{{ cluster_owner_email }}"
            protocol: "email"
      ignore_errors: true
      register: _rm_sns_topic

    # The SNS topic is deleted after the report is sent, so its own failure
    # cannot appear in that report -- but it still has to reach the operator's
    # terminal and the exit status.
    - name: Append the SNS topic to the orphan list if its deletion failed
      set_fact:
        _orphaned_resources: >-
          {{ _orphaned_resources + ['SNS topic sns_alerts_' ~ cluster_name] }}
      when: _rm_sns_topic.failed | default(false)

    - name: Print cluster deletion summary
      debug:
        msg: >-
          {{ [
               "=================================================================",
               "",
               "Initiated shutdown: " ~ start_delete_timer.stdout,
               "Completed shutdown: " ~ stop_delete_timer.stdout,
               "",
               _delete_headline,
             ]
             + ([
                 "",
                 "Retained in the account (not deleted, still billing):",
                 "",
               ] + (_retained_resources | map('regex_replace', '^', '  - ') | list)
                 if _retained_resources else [])
             + [
               "=================================================================",
             ] }}
      when: not _orphaned_resources

    - name: Print cluster deletion summary with the resources that survived cleanup
      debug:
        msg: >-
          {{ [
               "=================================================================",
               "",
               "Initiated shutdown: " ~ start_delete_timer.stdout,
               "Completed shutdown: " ~ stop_delete_timer.stdout,
               "",
               _delete_headline,
               (_orphaned_resources | length) ~ " cleanup step(s) FAILED.",
               "The following resources are still in the account and must be",
               "removed by hand -- re-running kill_pcluster.py will not retry them",
               "once " ~ cluster_name ~ ".serial has been deleted:",
               "",
             ]
             + (_orphaned_resources | map('regex_replace', '^', '  - ') | list)
             + ([
                 "",
                 "Retained in the account on purpose (not failures, still billing):",
                 "",
               ] + (_retained_resources | map('regex_replace', '^', '  - ') | list)
                 if _retained_resources else [])
             + [
               "",
               "Serial number: " ~ cluster_serial_number,
               "=================================================================",
             ] }}
      when: _orphaned_resources | length > 0

    - name: Fail with actionable message after cleanup when CloudFormation reached DELETE_FAILED
      fail:
        msg:
          - "ERROR: CloudFormation stack deletion reached DELETE_FAILED for cluster '{{ cluster_name }}'."
          - "IAM, SSM, and S3 resources have been cleaned up."
          - "The SSH keypair, local .pem file, and Secrets Manager secret were preserved so the"
          - "head node remains reachable for troubleshooting."
          - "Resolve the remaining CloudFormation dependency and re-run kill_pcluster.py if needed."
      when: _cf_delete_failed | bool

    # The gate is the same one the preservation warning above uses, which keeps
    # this mutually exclusive with the DELETE_FAILED fail: -- and it must stay a
    # positive confirmation rather than "not DELETE_FAILED", or a wait timeout
    # exits 0 again.  Placed after both summary prints so the operator reads the
    # summary before the abort, per the ordering rule the other two fail: tasks
    # follow.
    - name: Fail because the cluster deletion was never confirmed
      fail:
        msg:
          - "ERROR: deletion of cluster '{{ cluster_name }}' was never confirmed."
          - "The stack reached neither DELETE_COMPLETE nor DELETE_FAILED, so it may"
          - "still be deleting -- and it may still be billing."
          - "Every other resource was cleaned up; the SSH keypair, the local .pem"
          - "file, and the Secrets Manager secret were PRESERVED so the head node"
          - "stays reachable."
          - "Confirm the stack is gone, then re-run to remove the credentials:"
          - "  pcluster describe-cluster --cluster-name {{ cluster_name }} --region {{ region }}"
          - "  ./kill_pcluster.py -N {{ cluster_name }}"
      when: not (_cf_delete_confirmed | bool) and not (_cf_delete_failed | bool)

    - name: Fail because cleanup left resources behind
      fail:
        msg: >-
          ERROR: teardown of '{{ cluster_name }}' left {{ _orphaned_resources | length }}
          resource(s) in the account. See the summary above for the list. These were
          reported as ignored failures, not skipped steps -- the account is not clean.
      when: _orphaned_resources | length > 0
