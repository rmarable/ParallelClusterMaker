---
name: test

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m venv .venv && .venv/bin/pip install -r requirements.txt

      - name: Run tests
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `make lint` runs `.venv/bin/python -m pyflakes`, so the venv has to
      # exist here too -- this job used to install ansible-lint and nothing
      # else, which was correct while the target linted two playbooks and
      # became a guaranteed "no such file" the moment it did not. Only
      # pyflakes is installed rather than all of requirements.txt: the
      # target needs exactly that, and the test job already pays for the
      # full install. Widen this if `make lint` ever needs more.
      - name: Create the venv the lint target expects
        run: python -m venv .venv && .venv/bin/pip install pyflakes

      - name: Run lint
        run: make lint

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: make shellcheck
